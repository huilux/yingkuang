name: Desktop checks and packages

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Let main's installation builds finish; superseded PR checks can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb
          - os: windows-2022
            artifact: windows-x64
            bundles: nsis
          - os: macos-15
            artifact: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            artifact: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 python3-gi gir1.2-webkit2-4.1 xvfb
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Collect dependency license materials
        run: npm run licenses:collect
      - name: Upload license materials for review
        uses: actions/upload-artifact@v4
        with:
          name: yingkuang-licenses-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: test-output/licenses/
      - run: npm test
      - run: npm run build
      - name: Verify template updates and responsive layouts in WebKit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 1422 > /tmp/yingkuang-template-vite.log 2>&1 &
          template_vite_pid=$!
          trap 'kill "$template_vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:1422/ > /dev/null; then break; fi
            sleep 0.2
          done
          WATERMARK_TEST_WIDTH=1100 WATERMARK_TEST_HEIGHT=720 xvfb-run -a /usr/bin/python3 scripts/run-webkit-regressions.py http://127.0.0.1:1422 template-layout-regression.js template-layout-persistence-regression.js template-update-regression.js
      - name: Verify production CSP in WebKit
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 scripts/check-csp.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build installation package
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci
        env:
          # Ad-hoc signing for test builds; this is not Developer ID notarization.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run build:appimage -- --bundle-only
      - name: Validate actual Debian package metadata
        if: runner.os == 'Linux'
        run: |
          package=$(node scripts/beta-release.mjs package linux-x64)
          node scripts/check-deb.mjs "$package"
      - name: Audit actual AppImage system payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -m unittest discover -s scripts -p 'test_appimage_audit.py'
          package=$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)
          audit_dir=$(mktemp -d)
          (cd "$audit_dir" && "$package" --appimage-extract > /dev/null)
          /usr/bin/python3 scripts/audit-appimage.py "$audit_dir/squashfs-root" test-output/appimage-audit
          sha256sum "$package" | sed 's|  .*/|  |' > test-output/appimage-audit/APPIMAGE-SHA256.txt
      - name: Upload AppImage system license review materials
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yingkuang-appimage-system-review
          if-no-files-found: error
          retention-days: 14
          path: test-output/appimage-audit/
      - name: Upload test packages
        # Public packages are staged and verified by beta-draft.yml.
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: yingkuang-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
