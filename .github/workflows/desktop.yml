name: Desktop checks and packages

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb
          - os: windows-2022
            artifact: windows-x64
            bundles: nsis
          - os: macos-15
            artifact: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            artifact: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Collect dependency license materials
        run: npm run licenses:collect
      - name: Upload license materials for review
        uses: actions/upload-artifact@v4
        with:
          name: yingkuang-licenses-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: test-output/licenses/
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build installation package
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci
        env:
          # Ad-hoc signing for test builds; this is not Developer ID notarization.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run build:appimage
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: yingkuang-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
