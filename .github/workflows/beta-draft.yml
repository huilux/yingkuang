name: Prepare beta release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease draft tag matching package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate exact draft and source version
        run: node scripts/beta-release.mjs validate "$env:RELEASE_TAG" "$env:GITHUB_SHA"
        if: runner.os == 'Windows'
      - name: Validate exact draft and source version
        run: node scripts/beta-release.mjs validate "$RELEASE_TAG" "$GITHUB_SHA"
        if: runner.os == 'Linux'
      - name: Install Linux build and window-check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3-gi gir1.2-webkit2-4.1 xvfb xdotool squashfs-tools webkit2gtk-driver
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable exact Ubuntu corresponding-source downloads
        if: runner.os == 'Linux'
        run: |
          echo 'deb-src http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/yingkuang-source.list
          echo 'deb-src http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/yingkuang-source.list
          echo 'deb-src http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/yingkuang-source.list
          sudo apt-get update
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test AppImage provenance and source guards
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p 'test_appimage*.py'
      - name: Build beta installer with dependency licenses
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci
      - name: Check Linux CSP
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 scripts/check-csp.py
      - name: Verify themes and empty canvas in WebKit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p test-output
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1422 --strictPort > test-output/theme-vite.log 2>&1 &
          theme_server_pid=$!
          trap 'kill "$theme_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:1422 > /dev/null && break
            sleep 1
          done
          WATERMARK_TEST_WIDTH=1100 WATERMARK_TEST_HEIGHT=720 xvfb-run -a /usr/bin/python3 scripts/run-webkit-regressions.py http://127.0.0.1:1422 interface-controls-regression.js crop-loading-regression.js theme-layout-regression.js
      - name: Install deb, observe native window, verify notices and uninstall
        if: runner.os == 'Linux'
        run: |
          package=$(node scripts/beta-release.mjs package linux-x64)
          node scripts/check-deb.mjs "$package"
          xvfb-run -a /usr/bin/python3 scripts/smoke-beta-linux.py "$package"
      - name: Install Windows package, observe native window and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-beta-windows.ps1
      - name: Build AppImage payload and source-controlled static runtime
        if: runner.os == 'Linux'
        run: |
          npm run build:appimage -- --bundle-only
          bash scripts/appimage/build-runtime.sh
      - name: Complete AppImage provenance, original notices and exact sources
        if: runner.os == 'Linux'
        run: |
          python scripts/appimage/finalize.py src-tauri/target/release/bundle/appimage/yingkuang.AppDir test-output/yingkuang.AppImage test-output/appimage-materials test-output/appimage-runtime
          xvfb-run -a python scripts/appimage/native-check.py test-output/yingkuang.AppImage test-output/appimage-materials/native-checks.json
          xvfb-run -a python scripts/appimage/stage.py test-output/yingkuang.AppImage test-output/appimage-materials
      - name: Stage AppImage only in the existing unpublished draft
        if: runner.os == 'Linux'
        run: node scripts/beta-release.mjs upload-appimage "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Stage Linux files only in the existing unpublished draft
        if: runner.os == 'Linux'
        run: node scripts/beta-release.mjs upload-platform linux-x64 "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Stage Windows files only in the existing unpublished draft
        if: runner.os == 'Windows'
        run: node scripts/beta-release.mjs upload-platform windows-x64 "$env:RELEASE_TAG" "$env:GITHUB_SHA"

  assemble:
    needs: beta
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified files from the private draft
        run: |
          node scripts/beta-release.mjs validate "$RELEASE_TAG" "$GITHUB_SHA"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_linux-x64*' --pattern '*_windows-x64*' --pattern '*_linux-appimage-x64*' --dir test-output/beta-staging
      - name: Test release assembly guards
        run: python -m unittest discover -s scripts -p 'test_beta_release.py'
      - name: Assemble three packages, materials and checksums
        run: python scripts/assemble-beta-release.py test-output/beta-staging test-output/beta-release "$GITHUB_SHA"
      - name: Upload five assets only to the existing draft
        run: node scripts/beta-release.mjs upload "$RELEASE_TAG" "$GITHUB_SHA"
