name: Prepare beta release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease draft tag matching package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate exact draft and source version
        run: node scripts/beta-release.mjs validate "$env:RELEASE_TAG" "$env:GITHUB_SHA"
        if: runner.os == 'Windows'
      - name: Validate exact draft and source version
        run: node scripts/beta-release.mjs validate "$RELEASE_TAG" "$GITHUB_SHA"
        if: runner.os == 'Linux'
      - name: Install Linux build and window-check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3-gi gir1.2-webkit2-4.1 xvfb xdotool
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build beta installer with dependency licenses
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci
      - name: Check Linux CSP
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 scripts/check-csp.py
      - name: Extract deb, observe native window and verify installed notices
        if: runner.os == 'Linux'
        run: |
          package=$(node scripts/beta-release.mjs package linux-x64)
          install_dir=$(mktemp -d)
          dpkg-deb --extract "$package" "$install_dir"
          xvfb-run -a /usr/bin/python3 scripts/smoke-beta-linux.py "$install_dir"
          node scripts/beta-release.mjs stage linux-x64 "$install_dir" "$GITHUB_SHA"
      - name: Install Windows package, observe native window and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-beta-windows.ps1
      - name: Upload Linux assets only to the existing draft
        if: runner.os == 'Linux'
        run: node scripts/beta-release.mjs upload linux-x64 "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Upload Windows assets only to the existing draft
        if: runner.os == 'Windows'
        run: node scripts/beta-release.mjs upload windows-x64 "$env:RELEASE_TAG" "$env:GITHUB_SHA"
