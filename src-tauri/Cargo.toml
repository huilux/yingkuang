[package]
name = "yingkuang"
version = "0.5.7"
description = "Local photography watermark and frame editor"
authors = ["Ming"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yingkuang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
base64 = "0.23.1"
kamadak-exif = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2.32"
little_exif = "0.6.23"
lcms2 = "6.1.1"
tempfile = "3.27.0"
sha2 = "0.10.9"
ttf-parser = "0.25.1"

# Keep photo decoding and thumbnail generation interactive in `tauri dev`.
# The application itself retains normal debug builds and debugging information.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Generic image operations are instantiated in this crate. Optimizing only the
# image dependency leaves resizing, compositing and our pixel loops unoptimized.
# Keep debug information and assertions while making desktop exports interactive.
[profile.dev.package.yingkuang]
opt-level = 2

[profile.dev.package.little_exif]
opt-level = 2


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
